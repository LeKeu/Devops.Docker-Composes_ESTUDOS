version: '3.8'

services:    
# https://deepwiki.com/jaegertracing/jaeger/6.4-docker-compose-examples
# https://citizix.com/how-to-setup-and-run-jaeger-with-docker-and-docker-compose/
  jaeger:
    image: jaegertracing/all-in-one:1.57
    container_name: jaeger01
    environment:
      - COLLECTOR_OTLP_ENABLED=true
    ports:
      - "16686:16686"     # Jaeger UI
      - "14268:14268"     # Collector HTTP (Jaeger Thrift)
      - "14250:14250"     # Collector gRPC (Jaeger)
      - "4317:4317"       # OpenTelemetry gRPC
      - "4318:4318"       # OpenTelemetry HTTP
      - "6831:6831/udp"   # Jaeger agent (compact thrift)
      - "6832:6832/udp"   # Jaeger agent (binary thrift)
      - "9411:9411"       # Zipkin compatibility
